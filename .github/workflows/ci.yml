name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    # the app's tests run against a real PostgreSQL, same version and login as docker-compose.yml
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tripledger
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing -d tripledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run all tests
        run: mvn -B verify
