spring:
  application:
    name: tripledger
  # the Postgres from docker-compose.yml. Override with DB_URL / DB_USER / DB_PASSWORD anywhere else.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tripledger}
    username: ${DB_USER:billing}
    password: ${DB_PASSWORD:billing_dev_only}
  # schema lives in src/main/resources/db/migration and is applied on startup
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

# every log line carries the request's trace id, the same one the client sees in X-Trace-Id
logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Swagger UI at http://localhost:8080/swagger-ui.html, raw spec at /v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

tripledger:
  security:
    # HS256 signing secret, at least 32 characters. This default is for local runs ONLY -
    # set JWT_SECRET to a long random value anywhere real.
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    issuer: tripledger
    token-ttl: 8h
    # POST /v1/dev/tokens hands a token to anyone who asks - great for a demo, must be false anywhere real
    dev-tokens: ${DEV_TOKENS:true}
  jobs:
    # background worker + recovery scan on a timer. Tests turn this off and drive them by hand.
    enabled: true
    poll-millis: 2000            # look for due jobs every 2 s
    batch-size: 20
    lease: 60s                   # a claimed job is ours for 60 s; if we die, another worker takes it after that
    max-attempts: 5
    retry-base: 10s              # retries after 10 s, 30 s, 90 s, 270 s ...
    retry-max: 10m               # ...but never wait more than 10 min
    recovery-scan-millis: 60000  # once a minute: routing healthy? then re-queue DEGRADED trips
    recovery-batch: 100
  routing:
    # which map service to ask for road distances. Only "mock" exists for now.
    provider: mock
    # grid size for the route cache, in micro-degrees. 200 = 0.0002 deg, roughly a 22 m square
    # around Bengaluru. Gaps that start and end in the same cells share one cached route.
    cell-micro-degrees: 200
    cache:
      max-entries: 100000
      # roads don't change every day; a week keeps the hit rate high without going stale
      time-to-live: 7d
    breaker:
      window-size: 10           # judge the provider on its last 10 calls
      minimum-calls: 5          # ...but only once it has had at least 5
      failure-rate-percent: 50  # half of them failing = open the circuit
      wait-in-open: 30s         # stop calling for 30 s
      half-open-calls: 3        # then let 3 trial calls through
    mock:
      road-factor: 1.3          # mock "road" = straight line x 1.3
